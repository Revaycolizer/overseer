[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overseer-client"
version = "0.1.0"
description = "HTTP client for the Overseer AI orchestration platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Revaycolizer", email = "albinuslucas@gmail.com" },
]
dependencies = [
    "httpx>=0.27.0",
]
keywords = ["ai", "agent", "orchestration", "client"]

[project.urls]
Homepage = "https://github.com/revaycolizer/overseer"
Repository = "https://github.com/revaycolizer/overseer"

[tool.setuptools.packages.find]
where = ["."]
include = ["overseer*"]

[tool.setuptools.package-data]
overseer = ["py.typed"]
