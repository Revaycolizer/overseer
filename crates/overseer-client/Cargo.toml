[package]
name = "overseer-client"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "HTTP client for the Overseer AI orchestration platform."
authors = ["Revaycolizer <albinuslucas@gmail.com>"]
homepage = "https://github.com/revaycolizer/overseer"
repository = "https://github.com/revaycolizer/overseer"
keywords = ["ai", "agent", "orchestration", "client", "http"]
categories = ["development-tools::debugging", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
