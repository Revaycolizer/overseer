[package]
name = "overseer-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Overseer Kernel: deterministic policy enforcement, approval persistence and runtime coordination for agent actions."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls (not native-tls) so the kernel crate never pulls openssl-sys.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono"] }
tokio = { version = "1.49.0", features = ["sync", "time", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1.86"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
