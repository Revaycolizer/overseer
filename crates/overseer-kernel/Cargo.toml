[package]
name = "overseer-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Overseer Kernel: deterministic policy enforcement, approval persistence and runtime coordination for agent actions."
authors = ["Revaycolizer <albinuslucas@gmail.com>"]
homepage = "https://github.com/revaycolizer/overseer"
repository = "https://github.com/revaycolizer/overseer"
keywords = ["ai", "agent", "orchestration", "policy", "approval"]
categories = ["development-tools::debugging", "embedded" ]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls (not native-tls) so the kernel crate never pulls openssl-sys.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "chrono"] }
tokio = { version = "1.49.0", features = ["sync", "time", "macros", "rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1.86"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
