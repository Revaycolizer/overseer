[package]
name = "overseer"
version = "0.1.0"
authors = ["Revaycolizer <albinuslucas@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "desktop"] }
dioxus-material-icons = "4.0.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
rig = { package = "rig-core", version = "0.30.0" }
async-trait = "0.1.86"
base64 = "0.22.1"
mime_guess = "2.0.5"
lancedb = "0.10.0"
uuid = { version = "1.0", features = ["v4"] }
arrow = "52"
futures = "0.3"
chrono = "0.4"
enigo = "0.3.0"
rand = "0.10"
regex = "1.11"
md5 = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono"] }
rs-snowflake = "0.6.0"
tempfile = "3.27.0"
log = "0.4.29"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
