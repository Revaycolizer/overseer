[workspace]
# The root `overseer` package is the workspace root and a member. The kernel is a
# separate library crate so the deterministic policy + approval runtime can be
# built and tested WITHOUT the desktop GUI stack (dioxus-desktop, enigo, cpal),
# which is exactly what the milestone asks for ("test policy and runtime
# coordination independently from Dioxus UI code").
members = ["crates/overseer-kernel", "crates/overseer-client"]
resolver = "2"

[package]
name = "overseer"
version = "0.1.4"
authors = ["Revaycolizer <albinuslucas@gmail.com>"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/revaycolizer/overseer"
repository = "https://github.com/revaycolizer/overseer"
default-run = "overseer"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "desktop"] }
dioxus-material-icons = "4.0.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
anyhow = "1.0.100"
rig = { package = "rig-core", version = "0.30.0" }
async-trait = "0.1.86"
axum = { version = "0.7", features = ["ws"] }
tower_governor = "0.4"
governor = "0.6"
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }
base64 = "0.22.1"
mime_guess = "2.0.5"
lancedb = { version = "0.10.0", optional = true }
uuid = { version = "1.0", features = ["v4"] }
arrow = { version = "52", optional = true }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
regex = "1.11"
md5 = "0.7"
sha2 = "0.10"
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
zenwebp = "0.2"
argon2 = "0.5"
hex = "0.4"
getrandom = "0.2"
aes-gcm = "0.10"
cron = "0.13"
which = "7.0"
tar = "0.4"
tokio-tungstenite = "0.24"
flate2 = "1.0"
rayon = "1.10"
docx-rs = "0.4"
genpdf = "0.2"
rust_xlsxwriter = "0.79"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono"] }
overseer-kernel = { path = "crates/overseer-kernel" }
rs-snowflake = "0.6.0"
tempfile = "3.27.0"
log = "0.4.29"
charming = { version = "0.6.0", features = ["ssr"] }
urlencoding = "2.1"
dirs = "6.0"
pdf-extract = "0.7"
dioxus-desktop = "0.7.9"
sysinfo = "0.33.1"
cpal = "0.17.3"
rustpotter = "3.0.2"
rodio = "0.22.2"
ringbuf = "0.3"
hound = "3.5"
enigo = "0.3.0"
ort = { version = "2.0.0-rc.9", features = ["copy-dylibs"] }
whisper-rs = { version = "0.14.0", optional = true }
ndarray = "0.15"
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }

[[bin]]
name = "overseer-tui"
path = "src/bin/tui.rs"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse", # GetLastInputInfo, LASTINPUTINFO
    "Win32_System_SystemInformation", # GetTickCount
    "Win32_System_Threading",
] }


[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
memory = ["dep:lancedb", "dep:arrow"]
whisper = ["dep:whisper-rs"]
# Opt-in test suites. `cargo test --workspace` (no features) is fully
# deterministic: no display server, no keyboard/mouse, no Ollama, no internet,
# no user interaction. These features enable tests that need real resources.
#   cargo test --workspace --features live-hardware-tests -- --nocapture
#   cargo test --workspace --features live-provider-tests  -- --nocapture
live-hardware-tests = []   # real desktop session (screenshots, window state, input)
live-provider-tests = []   # a running Ollama / network model backend

[package.metadata.bundle]
name = "Overseer"
identifier = "ai.overseer.desktop"
icon = ["assets/overseer.png"]
short_description = "Local-first AI orchestration mission control."
category = "DeveloperTool"

[package.metadata.bundle.debian]
depends = [
    "libwebkit2gtk-4.1-0",
    "libayatana-appindicator3-1",
    "xdotool",
    "wmctrl",
    "scrot",
    "x11-utils",
    "alsa-utils",
    "xclip",
    "wl-clipboard",
    "grim",
    "wtype"
]

[package.metadata.overseer]
product_name = "Overseer"
publisher = "Revaycolizer"
channel = "stable"

[profile.release]
opt-level = "s"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
