name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  cargo-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc --no-progress -y
          echo "PROTOC=C:\ProgramData\chocolatey\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cargo check
        shell: powershell
        run: cargo check --features desktop
