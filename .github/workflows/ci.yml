name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  desktop-ui-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop-ui/pnpm-lock.yaml
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache desktop Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop app (unsigned, no installer)
        run: pnpm tauri build --no-bundle -- --locked

  cargo-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc --no-progress -y
          echo "PROTOC=C:\ProgramData\chocolatey\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cargo check
        shell: powershell
        run: cargo check

      - name: Cargo clippy
        continue-on-error: true
        shell: powershell
        run: cargo clippy

      - name: Cargo fmt check
        shell: powershell
        run: cargo fmt --check

      - name: Run tests (kernel)
        shell: powershell
        run: cargo test -p overseer-kernel

      - name: Run tests (library)
        shell: powershell
        run: cargo test --lib

      - name: Run tests (integration)
        shell: powershell
        run: cargo test --test kernel_bridge_integration --test v3_integration

  cargo-check-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev protobuf-compiler libasound2-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (no desktop features)
        run: cargo check --lib
      - name: Test GTK safety backport with optimizations
        run: CARGO_TARGET_DIR=target cargo test --manifest-path vendor/glib/Cargo.toml --lib variant_iter --release
      - name: Check GTK template macros
        run: CARGO_TARGET_DIR=target cargo check --manifest-path vendor/gtk3-macros/Cargo.toml

  cargo-check-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: brew install protobuf
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (engine, terminal, kernel, and client)
        run: cargo check --workspace --lib --bins
      - name: Run deterministic workspace tests
        run: cargo test --locked --workspace
      - name: Test optional vector memory persistence
        run: cargo test --locked --lib --features memory engine::memory::tests::local_memory_table_round_trip
      - name: Test wake-word inference compatibility
        run: CARGO_TARGET_DIR=target cargo test --manifest-path vendor/rustpotter/Cargo.toml --lib

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: |
          cargo audit --deny warnings
          cargo audit --file desktop-ui/src-tauri/Cargo.lock --deny warnings
