name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  cargo-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc --no-progress -y
          echo "PROTOC=C:\ProgramData\chocolatey\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cargo check (all features)
        shell: powershell
        run: cargo check --features desktop

      - name: Cargo clippy
        shell: powershell
        run: cargo clippy -- -D warnings

      - name: Cargo fmt check
        shell: powershell
        run: cargo fmt --check

      - name: Run tests (kernel)
        shell: powershell
        run: cargo test -p overseer-kernel

      - name: Run tests (library)
        shell: powershell
        run: cargo test --lib

      - name: Run tests (integration)
        shell: powershell
        run: cargo test --test kernel_bridge_integration --test v3_integration

  cargo-check-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libssl-dev protobuf-compiler
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (no desktop features)
        run: cargo check --lib

  cargo-check-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Cargo check (no desktop features)
        run: cargo check --lib

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Check for outdated deps
        run: cargo outdated --exit-code 1 || echo "Some deps outdated (non-blocking)"
