# Publish crates to crates.io and PyPI on version tags.
#
# Triggered by:
#   git tag v0.1.0       # Publish overseer-kernel + overseer-client
#   git tag kernel-v0.1.0 # Publish only overseer-kernel
#   git tag client-v0.1.0 # Publish only overseer-client
#   git tag py-v0.1.0     # Publish Python client to PyPI

name: Publish SDK packages

on:
  push:
    tags:
      - "v*"
      - "kernel-*"
      - "client-*"
      - "py-*"

jobs:
  # ── Determine which packages to publish ──────────────────────────────
  select:
    runs-on: ubuntu-latest
    outputs:
      publish_kernel: ${{ steps.check.outputs.kernel }}
      publish_client: ${{ steps.check.outputs.client }}
      publish_python: ${{ steps.check.outputs.python }}
    steps:
      - name: Parse tag
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          echo "kernel=false" >> $GITHUB_OUTPUT
          echo "client=false" >> $GITHUB_OUTPUT
          echo "python=false" >> $GITHUB_OUTPUT
          case "$TAG" in
            v*) echo "kernel=true" >> $GITHUB_OUTPUT ; echo "client=true" >> $GITHUB_OUTPUT ;;
            kernel-*) echo "kernel=true" >> $GITHUB_OUTPUT ;;
            client-*) echo "client=true" >> $GITHUB_OUTPUT ;;
            py-*) echo "python=true" >> $GITHUB_OUTPUT ;;
          esac

  # ── Publish overseer-kernel to crates.io ─────────────────────────────
  publish-kernel:
    needs: [select]
    if: needs.select.outputs.publish_kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo login ${{ secrets.CRATES_IO_TOKEN }}
      - run: cargo publish -p overseer-kernel
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── Publish overseer-client to crates.io ─────────────────────────────
  publish-client:
    needs: [select]
    if: needs.select.outputs.publish_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo login ${{ secrets.CRATES_IO_TOKEN }}
      - run: cargo publish -p overseer-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  # ── Publish Python client to PyPI ────────────────────────────────────
  publish-python:
    needs: [select]
    if: needs.select.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
